[project]
name = "production-cv-agent"
version = "0.1.0"
description = "Production Computer Vision Agent for Face Emotion Classification"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.2",

    "python-dotenv>=1.2.2",
    "roboflow>=1.4.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]